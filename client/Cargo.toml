[package]
name    = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json  = "1.0.151"
serde       = { version = "1.0.229", features = ["derive"      ] }
dioxus      = { version = "0.7.10" , features = ["web","router"] }
reqwest     = { version = "0.13.5" , features = ["json"        ] }
gloo-net    = { version = "0.6"    , features = ["http"        ] }
web-sys     = { version = "0.3.105", features = ["console"     ] }
gloo-timers = { version = "0.4.0"  , features = ["futures"     ] }

[profile.dev]
opt-level = 0
